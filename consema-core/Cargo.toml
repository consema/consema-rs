[package]
name = "consema-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable values and common protocols for Consema"
repository = "https://github.com/consema/consema-rs"
homepage = "https://github.com/consema/consema-rs"
documentation = "https://docs.rs/consema-core"

[lints]
workspace = true

[package.metadata.cargo-semver-checks.lints]
# reason: v0.8.0 后 MatchRole 的有意 API 演进——XML/plist/HCL 格式家族落地时
# 新增的全部 Xml*/Plist*/Hcl* variant（含 XmlErrorRegion、HclErrorRegion，
# query.rs:274/:312），引入 commit 8c02951（0.10.0/0.13.0 里程碑），G5.5
# API 稳定性审查已确认可接受。cargo-semver-checks 0.50.0 无逐 variant
# allowlist（不存在 semver-checks.toml，仅支持 lint 级覆盖），故本 crate 的
# enum_variant_added 整体豁免；今后本 crate 新增 variant 同样会被豁免，
# 须在 API 审查中留意。
enum_variant_added = "allow"

