[package]
name = "consema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Consema public facade"
repository = "https://github.com/consema/consema-rs"
homepage = "https://github.com/consema/consema-rs"
documentation = "https://docs.rs/consema"

[dependencies]
consema-core = { path = "../consema-core", version = "1.0.0-rc.1" }
consema-document = { path = "../consema-document", version = "1.0.0-rc.1" }
consema-graph = { path = "../consema-graph", version = "1.0.0-rc.1" }
consema-hcl = { path = "../consema-hcl", version = "1.0.0-rc.1" }
consema-ini = { path = "../consema-ini", version = "1.0.0-rc.1" }
consema-json = { path = "../consema-json", version = "1.0.0-rc.1" }
consema-plist = { path = "../consema-plist", version = "1.0.0-rc.1" }
consema-protocol = { path = "../consema-protocol", version = "1.0.0-rc.1" }
consema-properties = { path = "../consema-properties", version = "1.0.0-rc.1" }
consema-pvce = { path = "../consema-pvce", version = "1.0.0-rc.1" }
consema-toml = { path = "../consema-toml", version = "1.0.0-rc.1" }
consema-xml = { path = "../consema-xml", version = "1.0.0-rc.1" }
consema-yaml = { path = "../consema-yaml", version = "1.0.0-rc.1" }

[[bin]]
name = "consema"
path = "src/bin/consema/main.rs"

[lints]
workspace = true

[package.metadata.cargo-semver-checks.lints]
# reason: v0.8.0 后 facade 枚举的有意 API 演进——XML/plist/HCL 格式家族落地时
# 新增的全部 Xml*/Plist*/Hcl* variant（ConversionProjectionReport、
# ConversionProjectionProvenance、FormatMismatch，conversion.rs:65/:67/:69、
# conversion.rs:86/:88/:90、lib.rs:505/:507/:509），引入 commit 8c02951
# （家族落地）与 29ba27d（facade 收口，0.9.0-0.11.0 记录），G5.5 API 稳定性
# 审查已确认可接受。cargo-semver-checks 0.50.0 无逐 variant allowlist（不存在
# semver-checks.toml，仅支持 lint 级覆盖），故本 crate 的 enum_variant_added
# 整体豁免；今后本 crate 新增 variant 同样会被豁免，须在 API 审查中留意。
enum_variant_added = "allow"
