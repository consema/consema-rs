# cargo-fuzz manifest for consema-json (0.13.0 gate plan M2).
#
# This crate is NOT a workspace member: the workspace members list in the
# root Cargo.toml is explicit and this directory is excluded, so `cargo test
# --workspace` / `cargo clippy --workspace` never touch it. The `[workspace]`
# table makes this crate its own workspace root for standalone `cargo fuzz`
# builds.
#
# The target LOGIC lives in fuzz_logic/*.rs and is the single source of
# truth: the in-process harness (crates/consema-conformance/tests/
# parse_fuzz.rs and operation_fuzz.rs) includes those files directly, so the
# exact same assertions run under `cargo test` on this Windows/MSVC machine
# (which cannot link libFuzzer: no clang is installed). On a libFuzzer-capable
# host (Linux, nightly, clang) run:
#
#   cargo +nightly fuzz run parse
#   cargo +nightly fuzz run operations
#
# from this directory (see fuzz/README.md for the equivalence statement).
#
# A fuzz/Cargo.lock is generated by the first `cargo fuzz build` and should
# be committed together with the corpus for reproducibility (M8 evidence).

[package]
name = "consema-json-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"
description = "libFuzzer targets for consema-json (0.13.0 M2)"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
consema-json = { path = ".." }
consema-core = { path = "../../consema-core" }
consema-document = { path = "../../consema-document" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false

[[bin]]
name = "operations"
path = "fuzz_targets/operations.rs"
test = false
doc = false
