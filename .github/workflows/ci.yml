# Consema Rust workspace gate: three-OS CI (roadmap §14.12 "Windows、Linux、
# macOS CI", §15.6 "MSRV 在 manifest 中声明并在 CI 真正验证"). Every step
# maps to an existing repository command or script; no repository secrets are
# required (the audit job uses only the automatic GITHUB_TOKEN).
#
# This is the consema-rs repository (six-repo split): the jobs that depend on
# the monorepo's other language implementations (oracles, go-matrix,
# go-differential) live in the repositories that own them (consema /
# consema-go). The conformance job runs against the vendored conformance/
# snapshot committed in this repository; the authoritative suites live in the
# consema repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope (global minimum). Per-job elevation only
# where the job genuinely needs it: coverage uploads an artifact
# (actions: write) and audit posts a check run (checks: write, see below);
# all other jobs only read repository contents. Cache restore works with
# contents: read (tokio precedent); cache save denial is a warning only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy + rustdoc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (workspace, all-targets, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustdoc (workspace, no-deps, -D warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  test:
    name: cargo test --workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # cargo test --workspace compiles every example target of the
      # workspace (examples are built by `cargo test`, not executed), so
      # the README quick-start copy (consema/examples/quickstart.rs, the
      # committed twin of the README.md quick-start fence — the examples
      # job compares them byte-for-byte, wave-4 R6 2026-08-15) and
      # sdk_chain.rs are compile-gated on every OS leg in this step.
      # Doctests run by default too, but the 15 crates currently declare
      # no runnable doc examples (0 doctests), so crate-doc examples are
      # not an active gate today.
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  # Coverage trend gate (gate plan §4 M3 standing toolchain; roadmap §18.3
  # "Coverage 不替代语义证明"): scripts/coverage.ps1 measures the workspace
  # with cargo-llvm-cov over the test job's target set
  # (--workspace --all-targets --locked) and enforces the hard floors
  # (regions >= 70 / functions >= 70 / lines >= 80, --fail-under-* on every
  # invocation). -Trend additionally compares the workspace totals against
  # the report committed at HEAD (docs/COVERAGE-0.13.0.md) and fails when any
  # metric drops by more than 1.0 pp (the implementation is
  # `$delta -lt -$trendGatePercentPoints`, so a drop of exactly 1.0 pp
  # passes; a larger drop fails) -- the standing executor for the frozen
  # trend gate. The measured report is uploaded as an artifact (also on gate
  # failure, per the script's "evidence for the disposition" rule) and the
  # committed report is then restored, so this job gates regressions without
  # ever rewriting the committed numbers; per the script's own policy the
  # committed report is refreshed only by a release-milestone
  # `powershell -File scripts/coverage.ps1 -Trend` run.
  coverage:
    name: coverage (hard floors + -Trend vs committed report)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Uploads the measured report via upload-artifact (artifact service),
    # which requires the actions scope in addition to the global
    # contents: read.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo install cargo-llvm-cov (pinned 0.8.7)
        # G070: the tool version is pinned so the measured report does not
        # drift with a newer cargo-llvm-cov release (the committed baseline
        # in docs/COVERAGE-0.13.0.md was measured with 0.8.7).
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: scripts/coverage.ps1 -Trend (gate, keep artifact, restore committed report)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $coverageScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/coverage.ps1'
          $report = Join-Path $env:GITHUB_WORKSPACE 'docs/COVERAGE-0.13.0.md'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'target/coverage'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          & $coverageScript -Trend
          $code = $LASTEXITCODE
          # Preserve the measured report for the artifact, then restore the
          # committed report: this job measures and gates only, it never
          # rewrites the numbers committed at HEAD. The script writes the
          # measured report only on exit 0/1; on exit 2/3 (precondition or
          # execution failure) no measured report exists, so the committed
          # file must never be uploaded as if it were measured evidence.
          if ($code -le 1 -and (Test-Path -LiteralPath $report)) {
            Copy-Item -LiteralPath $report -Destination (Join-Path $artifactDir 'COVERAGE-0.13.0.md') -Force
          }
          git -C $env:GITHUB_WORKSPACE checkout -- docs/COVERAGE-0.13.0.md
          exit $code
      - name: upload measured coverage report (also on gate failure)
        # Fork PRs get a read-only GITHUB_TOKEN (the job-level actions: write
        # is not honored), so upload-artifact v4 fails with 403 there; the
        # artifact is evidence for non-fork runs only (G043).
        if: always() && !github.event.pull_request.head.repo.fork
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/coverage/COVERAGE-0.13.0.md
          if-no-files-found: warn

  # MSRV leg: rust-version = "1.85" is declared in the workspace manifest
  # (Cargo.toml rust-version) and must be really verified in CI (§15.6). It
  # runs the same gates as the stable legs on one OS.
  msrv:
    name: MSRV 1.85 gates (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.85.0
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (workspace, all-targets, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustdoc (workspace, no-deps, -D warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  # The repository freezes 18 language-neutral conformance suites with
  # 519/519 cases (README.md "18 套语言无关 conformance suite 共 519/519
  # cases"). The explicit job runs the crate's full test set (lib suites +
  # per-format hardening/fixtures/publication integration tests) and then
  # asserts the frozen counts AND the aggregate digest of the vendored
  # vectors (the digest value is read from the vendored conformance/DIGEST
  # file — wave-4 R10: the single sync point shared with release.yml; it
  # is the same frozen value the go/ts/py/kt runners share), so a vector
  # added or removed without updating the record, or a same-count byte
  # drift that leaves the verdicts unchanged, fails CI. The suites are the
  # vendored snapshot in conformance/ (authority: the consema repository).
  conformance:
    name: conformance + hardening + fixtures (18 suites / 519 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test -p consema-conformance --locked
        run: cargo test -p consema-conformance --locked
      - name: suite-count + aggregate digest assertions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vectorDir = Join-Path $env:GITHUB_WORKSPACE 'conformance/vectors'
          $suites = 0
          $cases = 0
          foreach ($file in Get-ChildItem -LiteralPath $vectorDir -Filter '*.json') {
            $vector = Get-Content -LiteralPath $file.FullName -Raw -Encoding utf8 | ConvertFrom-Json
            if (-not ($vector.suite -like 'consema.*')) {
              throw "unexpected suite id in $($file.Name): $($vector.suite)"
            }
            $suites += 1
            $cases += @($vector.cases).Count
          }
          if ($suites -ne 18 -or $cases -ne 519) {
            throw "suite-count mismatch: expected 18 suites / 519 cases, got $suites suites / $cases cases"
          }
          Write-Output "suite-count: $suites suites, $cases cases"
          # Aggregate digest assertion (G047): the vendored snapshot must
          # hash to the frozen five-repo-shared value. Algorithm is the
          # authority's (fc-manifest conformance_suite.note; identical to
          # consema-go/scripts/go-verify-shared-conformance.ps1 step [1/6]):
          # file-name byte-order sort, per-file sha256 lowercase hex, lines
          # `{basename}:{digest}` joined with '\n' without a trailing
          # newline, then sha256 of that UTF-8 string, over the canonical LF
          # checkout bytes (this repo's .gitattributes is `eol=lf`).
          $names = @(Get-ChildItem -LiteralPath $vectorDir -Filter '*.json' | ForEach-Object { $_.Name })
          [System.Array]::Sort($names, [System.StringComparer]::Ordinal)
          $lines = @()
          foreach ($name in $names) {
            $digest = (Get-FileHash -LiteralPath (Join-Path $vectorDir $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$name`:$digest"
          }
          $aggregateText = [string]::Join("`n", $lines)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $aggregateBytes = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($aggregateText))
          } finally {
            $sha.Dispose()
          }
          $computed = ([System.BitConverter]::ToString($aggregateBytes)).Replace('-', '').ToLowerInvariant()
          # Wave-4 R10: the expected digest is no longer a hand-maintained
          # literal here — it is read from the vendored conformance/DIGEST
          # file (the single sync point; re-vendor = recompute and commit
          # that file, exactly like the other vendored content).
          $expected = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'conformance/DIGEST') -Raw).Trim()
          if ($computed -ne $expected) {
            throw "aggregate digest mismatch: computed $computed, expected $expected (vendored snapshot drifted from the frozen inventory)"
          }
          Write-Output "aggregate digest: $computed (frozen value, $suites suites / $cases cases)"
      # G155: the mutation corpus `-- --check` generator-sync gate was
      # documented (conformance/README.md) but never executed anywhere;
      # this step makes the check a real standing gate — a stale corpus
      # fails CI.
      - name: mutation corpus --check (generator sync gate)
        run: cargo run -p consema-conformance --example gen_mutation_corpus --locked -- --check

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: embarkstudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories bans licenses sources

  # cargo audit via the SHA-pinned rustsec/audit-check action. Honest scope
  # (G136): the action is pinned, but cargo-audit itself is installed by the
  # action from its latest GitHub release and the RustSec advisory database
  # is fetched from GitHub at runtime — it is not snapshotted or pinned.
  audit:
    name: cargo audit (RustSec advisory DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # API/semver gate (§15.6 "Rust public API 完成独立审查"): the workspace
  # version is 1.0.0-rc.1 (Cargo.toml) and the semver baseline is still the
  # v0.8.0 monorepo state (the last released state; the crates are not
  # published to crates.io). This repository's history was created by a
  # subtree split, so the v0.8.0 tag itself does not exist here; commit
  # fbe98b5c is the split-history commit whose tree is identical to the
  # monorepo v0.8.0 crates/ tree, so it is the exact semantic baseline. The
  # v0.8.0 tree has 12 crate directories; the 11 published crates that
  # already existed at v0.8.0 are checked for breaking changes since the
  # baseline, consema-conformance (also present at v0.8.0) is excluded as a
  # test/verification crate that is not part of the published API surface
  # (the gate protects the published crates), and the three crates added
  # after 0.8.0 (consema-xml/plist/hcl) have no baseline and are excluded
  # (G170).
  #
  # Baseline mode: the baseline is materialized OUTSIDE the workspace root
  # (baseline-root). A nested baseline/ inside the checkout duplicates every
  # package manifest under the scanned root and cargo-semver-checks 0.36+
  # refuses to run ("package X is ambiguous"); baseline-rev resets the tree
  # in place and breaks cargo version resolution because the v0.8.0 crates
  # declare `consema-core = { path = ..., version = "0.8.0" }` against the
  # 1.0.0-rc.1 workspace (cargo update exit 101). The prepare step extracts
  # the fbe98b5c tree with git archive into $RUNNER_TEMP/semver-baseline,
  # writes the 11-member workspace root manifest (v0.8.0 workspace.package /
  # workspace.dependencies from the monorepo v0.8.0 root Cargo.toml) and
  # copies the committed baseline lockfile
  # (scripts/semver-baseline-Cargo.lock — wave-4 R10: a fixed snapshot
  # committed with the gate, replacing the old runtime
  # `cargo generate-lockfile`, so the same commit can never re-resolve
  # different transitive versions on different days; regenerate it with
  # `cargo generate-lockfile` on the exact manifest below when the gate
  # inputs change), so the baseline resolves its pinned deps deterministically.
  #
  # Release type: with versions 0.8.0 -> 1.0.0-rc.1 the tool derives a major
  # change, and a major change satisfies every lint's required update, so
  # all 254 lints are filtered out and the gate runs 0 checks (verified
  # locally: "0 checks, 254 unnecessary"). release-type: patch forces the
  # minor/major-requiring (breaking-change) lints to run, making the gate
  # real. Local run (cargo-semver-checks 0.50.0, 2026-08-12, exact action
  # invocation: 11 packages, release-type patch, baseline-root): all four
  # intentional post-0.8.0 enum-variant additions (the XML/plist/HCL
  # families, 8c02951/29ba27d, and M2-F1 RecoveredDocument) are allowlisted
  # per crate via [package.metadata.cargo-semver-checks.lints]
  # enum_variant_added = "allow":
  #   - consema::ConversionProjectionReport/ConversionProjectionProvenance/
  #     FormatMismatch gained Xml/Plist/Hcl
  #   - consema-core::MatchRole gained XmlErrorRegion/HclErrorRegion
  #   - consema-document::NodeRole gained XmlErrorRegion/HclErrorRegion
  #   - consema-json::EditFailure/ProjectionFailure gained RecoveredDocument
  # The fifth allowlist entry is a struct-field addition, not a variant:
  #   - consema-document::ParseLimits gained pub max_number_digits
  #     (constructible_struct_adds_field = "allow"; wave-4 P1
  #     digit-magnitude-DoS fix a9cfd08, 2026-08-15 — pre-1.0.0 intentional
  #     API evolution approved under roadmap §12.1/§21.1 version policy;
  #     #[non_exhaustive] hardening is scheduled at the 1.0.0 API freeze,
  #     decision record docs/API-REVIEW-0.13.0.md:174). Reproduced locally
  #     2026-08-15 with the exact action invocation (0.50.0, baseline-root
  #     fbe98b5c tree, release-type patch): consema-document is the ONLY
  #     crate this lint fires on — the consema facade's and consema-json's
  #     ParseLimits re-exports do not trigger it.
  # The gate is green: every crate reports 222-223 checks with 0 failures
  # (the allowlist is read by the action, which runs the CLI in place at the
  # workspace root with --baseline-root; verified by reproducing the exact
  # action invocation). Note cargo-semver-checks 0.50.0 has no per-variant
  # allowlist, only lint-level, so future variant additions to these four
  # crates are also exempted and must be vetted in API review.
  semver:
    name: cargo-semver-checks (baseline v0.8.0 crates/ tree)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # The action installs the latest cargo-semver-checks release when no
      # binary is on PATH; the pinned cargo install step above guarantees
      # the exact 0.50.0 binary (G070) while keeping the action's exact
      # invocation (the action skips installation when the tool is already
      # present).
      - name: cargo install cargo-semver-checks (pinned 0.50.0)
        run: cargo install cargo-semver-checks --version 0.50.0 --locked
      # Materialize the v0.8.0 baseline outside the workspace root (see the
      # job comment): the tree of split-history commit fbe98b5c equals the
      # monorepo v0.8.0 crates/ tree and has no root manifest of its own.
      - name: prepare semver baseline (fbe98b5c tree + 11-member workspace + lockfile)
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/semver-baseline"
          mkdir -p "$baseline"
          git archive fbe98b5cae562087832f5509f25c32dc91fdd990 | tar -x -C "$baseline"
          cat > "$baseline/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "3"
          members = [
              "consema",
              "consema-core",
              "consema-document",
              "consema-graph",
              "consema-ini",
              "consema-json",
              "consema-properties",
              "consema-protocol",
              "consema-pvce",
              "consema-toml",
              "consema-yaml",
          ]

          [workspace.dependencies]
          encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"] }
          sha2 = { version = "=0.11.0", default-features = false }
          toml_edit = { version = "=0.22.27", default-features = false, features = ["parse"] }
          saphyr-parser = { version = "=0.0.11", default-features = false }
          unicode-id-start = "=1.4.0"

          [workspace.package]
          version = "0.8.0"
          edition = "2024"
          rust-version = "1.85"
          license = "MIT"

          [workspace.lints.rust]
          unsafe_code = "forbid"
          missing_docs = "warn"

          [workspace.lints.clippy]
          all = { level = "warn", priority = -1 }
          pedantic = { level = "warn", priority = -1 }
          module_name_repetitions = "allow"
          cast_possible_truncation = "allow"
          cast_possible_wrap = "allow"
          doc_markdown = "allow"
          missing_errors_doc = "allow"
          missing_panics_doc = "allow"
          needless_pass_by_value = "allow"
          too_many_lines = "allow"
          EOF
          # Wave-4 R10: the committed lockfile snapshot is copied verbatim
          # (no runtime re-resolution — the same commit must always resolve
          # the same baseline; regenerate scripts/semver-baseline-Cargo.lock
          # deliberately when the gate inputs change).
          cp "$GITHUB_WORKSPACE/scripts/semver-baseline-Cargo.lock" "$baseline/Cargo.lock"
          echo "SEMVER_BASELINE_ROOT=$baseline" >> "$GITHUB_ENV"
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          baseline-root: ${{ env.SEMVER_BASELINE_ROOT }}
          release-type: patch
          package: >-
            consema,
            consema-core,
            consema-document,
            consema-graph,
            consema-ini,
            consema-json,
            consema-properties,
            consema-protocol,
            consema-pvce,
            consema-toml,
            consema-yaml

  # Package-archive verification (§15.6 "release artifact 可从干净环境重建",
  # scripts/verify-package-archives.ps1): on a clean checkout the script
  # packages every publishable crate, verifies tar-path safety and lockfile
  # checksums, checks each unpacked crate offline, and builds each crate
  # with the declared MSRV (1.85, from workspace rust-version) because the
  # MSRV leg is part of the 0.13.0 gate. cargo fetch warms the offline
  # cache that the script's --offline invocations rely on.
  package:
    name: verify-package-archives (with MSRV leg)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.85.0
        with:
          toolchain: 1.85.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fetch --locked
        run: cargo fetch --locked
      - name: scripts/verify-package-archives.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/verify-package-archives.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Version-consistency gate (tokio check-readme pattern): the README
  # "Workspace version:" line must equal the Cargo.toml [workspace.package]
  # version, so a version bump that forgets the README fails CI. The same
  # job also asserts (G073) that no other README position or the
  # .github/ISSUE_TEMPLATE/bug_report.yml contains a stray version literal
  # — the job name below covers both assertions (wave-4 R10).
  check-version-consistency:
    name: check version consistency (Cargo.toml vs README line + zero stray literals in README/bug_report.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: assert Cargo.toml [workspace.package] version == README Workspace version line
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^\[workspace\.package\]/{f=1} f && /^version[[:space:]]*=/{gsub(/[",]/, "", $3); print $3; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no 'version' found in Cargo.toml [workspace.package]"
            exit 1
          fi
          # G116: exact token comparison — a substring grep would let the
          # rc -> GA direction slip through (1.0.0 is a prefix of
          # "1.0.0-rc.1", so a stale README still matches). The README line
          # may carry a trailing annotation after the version, so extract
          # the first whitespace/full-width-paren-delimited token.
          readme_version=$(sed -n 's/^Workspace version: \([^ （]*\).*/\1/p' README.md | head -n 1)
          if [ -z "$readme_version" ]; then
            echo "::error::README.md has no 'Workspace version:' line"
            exit 1
          fi
          if [ "$readme_version" != "$version" ]; then
            echo "::error::README.md declares 'Workspace version: $readme_version', Cargo.toml has $version"
            exit 1
          fi
          echo "README version consistent with Cargo.toml: $version"
          # G073: no stray hardcoded version outside the authoritative
          # Workspace version line (quick-start fence, bug-report template,
          # prose): a bump that forgets one of these positions stays green
          # only if the numbers are not in the files at all. The README's
          # own Workspace version line is the one allowed occurrence.
          stray=$(grep -F -n "$version" README.md .github/ISSUE_TEMPLATE/bug_report.yml 2>/dev/null | grep -v 'Workspace version:' || true)
          if [ -n "$stray" ]; then
            echo "::error::hardcoded version '$version' outside the Workspace version line:"
            echo "$stray"
            exit 1
          fi
          echo "no stray '$version' literals in README.md / bug_report.yml"

  # SDK examples gate: every example target under consema/examples/ must
  # stay compilable. The test job also compiles them (`cargo test
  # --workspace` builds example targets on every OS leg), and this job
  # re-checks the same set by name so example breakage is surfaced
  # directly. sdk_chain.rs is the committed five-language SDK chain example
  # (parse -> native query -> best-exact projection -> semantic edit ->
  # canonical materialization -> TOML conversion; language-neutral contract
  # reference: consema repository docs/cookbook.md). quickstart.rs is the
  # committed copy of the README.md quick-start code fence; CI compares
  # the README fence code body byte-for-byte against it (wave-4 R6,
  # 2026-08-15: kt-style fence gate — replaces the "manual sync, no
  # byte-comparison fence" mechanism, R14, whose drift went silently
  # unnoticed, and the "粘贴版与入库版必须保持一致" claim is now
  # enforced, not asserted) and compiles the copy. Both are pure SDK
  # chains (no conformance data), so no provision step is needed.
  examples:
    name: examples (fence gate + cargo check --examples)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Knit-style doc-example gate (wave-4 R6, 2026-08-15; mirrors the
      # consema-kt ci-kotlin.yml fence step): the README ```rust quick-start
      # fence must equal the committed consema/examples/quickstart.rs code
      # body (after the file's leading //! doc-comment header, which is
      # prose, not code), so the snippet and the compiled copy can never
      # drift. The fence is located by content, not by position — every
      # ```rust fence in the README is compared against the file body and
      # exactly one must match, so a new fence inserted earlier can never
      # silently switch the comparison target.
      - name: README quick-start fence must match consema/examples/quickstart.rs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $readme = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Raw
          $file = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'consema/examples/quickstart.rs') -Raw
          $normalized = ($file -replace "`r", '') -split '(?m)^(?://![^\r\n]*\r?\n)+', 2
          if ($normalized.Count -ne 2) {
            throw 'consema/examples/quickstart.rs must start with a //! doc-comment header'
          }
          $body = $normalized[1].Trim()
          $matches = @()
          foreach ($m in [regex]::Matches($readme, '(?s)```rust\r?\n(.*?)\r?\n```')) {
            $fence = ($m.Groups[1].Value -replace "`r", '').Trim()
            if ($fence -eq $body) {
              $matches += $fence
            }
          }
          if ($matches.Count -ne 1) {
            throw "README.md must contain exactly one ```rust fence equal to consema/examples/quickstart.rs (after its //! header) — found $($matches.Count) matching fence(s)"
          }
          Write-Output 'README quick-start fence matches consema/examples/quickstart.rs (located by content)'
      - name: cargo check -p consema --examples --locked
        run: cargo check -p consema --examples --locked

  # Release-profile compile leg (wave-4 R13, G045): the failure-injection
  # seams (CONSEMA_APPLY_INTERRUPT_AFTER / CONSEMA_APPLY_WRITE_FAILURE)
  # are cfg(not(debug_assertions))-compiled out of release builds, and the
  # CLI help text / apply.rs docs promise that; every other CI job and the
  # release `cargo package` gate build the dev profile, so without this leg
  # the release variant is never compiled anywhere. This leg proves the
  # release variant really compiles (and the G045 claim with it).
  release-build:
    name: cargo build --release --locked (G045 injection-compile-out leg)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build --release --workspace --locked
        run: cargo build --release --workspace --locked

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error, so the
  # allowed-failures list is empty.
  check:
    name: check (all gates green)
    if: always()
    needs: [lint, test, coverage, msrv, conformance, deny, audit, semver, package, check-version-consistency, examples, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}
