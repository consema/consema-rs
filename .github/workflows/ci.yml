# Consema Rust workspace gate: three-OS CI (roadmap §14.12 "Windows、Linux、
# macOS CI", §15.6 "MSRV 在 manifest 中声明并在 CI 真正验证"). Every step
# maps to an existing repository command or script; no repository secrets are
# required (the audit job uses only the automatic GITHUB_TOKEN).
#
# This is the consema-rs repository (six-repo split): the jobs that depend on
# the monorepo's other language implementations (oracles, go-1-26,
# go-differential) live in the repositories that own them (consema /
# consema-go). The conformance job runs against the vendored conformance/
# snapshot committed in this repository; the authoritative suites live in the
# consema repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope (global minimum). Per-job elevation only
# where the job genuinely needs it: coverage uploads an artifact
# (actions: write) and audit posts a check run (checks: write, see below);
# all other jobs only read repository contents. Cache restore works with
# contents: read (tokio precedent); cache save denial is a warning only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy + rustdoc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (workspace, all-targets, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustdoc (workspace, no-deps, -D warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  test:
    name: cargo test --workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  # Coverage trend gate (gate plan §4 M3 standing toolchain; roadmap §18.3
  # "Coverage 不替代语义证明"): scripts/coverage.ps1 measures the workspace
  # with cargo-llvm-cov over the test job's target set
  # (--workspace --all-targets --locked) and enforces the hard floors
  # (regions >= 70 / functions >= 70 / lines >= 80, --fail-under-* on every
  # invocation). -Trend additionally compares the workspace totals against
  # the report committed at HEAD (docs/COVERAGE-0.13.0.md) and fails when any
  # metric drops >= 1.0 pp -- the standing executor for the frozen trend
  # gate. The measured report is uploaded as an artifact (also on gate
  # failure, per the script's "evidence for the disposition" rule) and the
  # committed report is then restored, so this job gates regressions without
  # ever rewriting the committed numbers; per the script's own policy the
  # committed report is refreshed only by a release-milestone
  # `powershell -File scripts/coverage.ps1 -Trend` run.
  coverage:
    name: coverage (hard floors + -Trend vs committed report)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Uploads the measured report via upload-artifact (artifact service),
    # which requires the actions scope in addition to the global
    # contents: read.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: swatinem/rust-cache@v2
      - name: cargo install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: scripts/coverage.ps1 -Trend (gate, keep artifact, restore committed report)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $coverageScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/coverage.ps1'
          $report = Join-Path $env:GITHUB_WORKSPACE 'docs/COVERAGE-0.13.0.md'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'target/coverage'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          & $coverageScript -Trend
          $code = $LASTEXITCODE
          # Preserve the measured report for the artifact, then restore the
          # committed report: this job measures and gates only, it never
          # rewrites the numbers committed at HEAD.
          if (Test-Path -LiteralPath $report) {
            Copy-Item -LiteralPath $report -Destination (Join-Path $artifactDir 'COVERAGE-0.13.0.md') -Force
          }
          git -C $env:GITHUB_WORKSPACE checkout -- docs/COVERAGE-0.13.0.md
          exit $code
      - name: upload measured coverage report (also on gate failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/coverage/COVERAGE-0.13.0.md
          if-no-files-found: warn

  # MSRV leg: rust-version = "1.85" is declared in the workspace manifest
  # (Cargo.toml rust-version) and must be really verified in CI (§15.6). It
  # runs the same gates as the stable legs on one OS.
  msrv:
    name: MSRV 1.85 gates (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (workspace, all-targets, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustdoc (workspace, no-deps, -D warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  # The repository freezes 18 language-neutral conformance suites with
  # 508/508 cases (README.md "18 套语言无关 conformance suite 共 508/508
  # cases"). The explicit job runs the crate's full test set (lib suites +
  # per-format hardening/fixtures/publication integration tests) and then
  # asserts the frozen counts from the vector files so a vector added or
  # removed without updating the record fails CI. The suites are the vendored
  # snapshot in conformance/ (authority: the consema repository).
  conformance:
    name: conformance + hardening + fixtures (18 suites / 508 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: cargo test -p consema-conformance --locked
        run: cargo test -p consema-conformance --locked
      - name: suite-count assertions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vectorDir = Join-Path $env:GITHUB_WORKSPACE 'conformance/vectors'
          $suites = 0
          $cases = 0
          foreach ($file in Get-ChildItem -LiteralPath $vectorDir -Filter '*.json') {
            $vector = Get-Content -LiteralPath $file.FullName -Raw -Encoding utf8 | ConvertFrom-Json
            if (-not ($vector.suite -like 'consema.*')) {
              throw "unexpected suite id in $($file.Name): $($vector.suite)"
            }
            $suites += 1
            $cases += @($vector.cases).Count
          }
          if ($suites -ne 18 -or $cases -ne 508) {
            throw "suite-count mismatch: expected 18 suites / 508 cases, got $suites suites / $cases cases"
          }
          Write-Output "suite-count: $suites suites, $cases cases"

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: embarkstudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories bans licenses sources

  # No-fetch cargo audit: rustsec/audit-check pins the RustSec advisory
  # database through the action instead of letting cargo-audit fetch it.
  audit:
    name: cargo audit (RustSec advisory DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # API/semver gate (§15.6 "Rust public API 完成独立审查"): the workspace
  # version is 1.0.0-rc.1 (Cargo.toml) and the semver baseline is still the
  # v0.8.0 monorepo state (the last released state; the crates are not
  # published to crates.io). This repository's history was created by a
  # subtree split, so the v0.8.0 tag itself does not exist here; commit
  # fbe98b5c is the split-history commit whose tree is identical to the
  # monorepo v0.8.0 crates/ tree, so it is the exact semantic baseline. The
  # 11 crates that already existed at v0.8.0 are checked for breaking changes
  # since the baseline; the three crates added after 0.8.0 (consema-xml/
  # plist/hcl) have no baseline and are excluded.
  #
  # Baseline mode: the baseline is materialized OUTSIDE the workspace root
  # (baseline-root). A nested baseline/ inside the checkout duplicates every
  # package manifest under the scanned root and cargo-semver-checks 0.36+
  # refuses to run ("package X is ambiguous"); baseline-rev resets the tree
  # in place and breaks cargo version resolution because the v0.8.0 crates
  # declare `consema-core = { path = ..., version = "0.8.0" }` against the
  # 1.0.0-rc.1 workspace (cargo update exit 101). The prepare step extracts
  # the fbe98b5c tree with git archive into $RUNNER_TEMP/semver-baseline and
  # writes the 11-member workspace root manifest (v0.8.0 workspace.package /
  # workspace.dependencies from the monorepo v0.8.0 root Cargo.toml) plus a
  # generated Cargo.lock, so the baseline resolves its pinned deps.
  #
  # Release type: with versions 0.8.0 -> 1.0.0-rc.1 the tool derives a major
  # change, and a major change satisfies every lint's required update, so
  # all 254 lints are filtered out and the gate runs 0 checks (verified
  # locally: "0 checks, 254 unnecessary"). release-type: patch forces the
  # minor/major-requiring (breaking-change) lints to run, making the gate
  # real. Local run (cargo-semver-checks 0.50.0, 2026-08-12, exact action
  # invocation: 11 packages, release-type patch, baseline-root): all four
  # intentional post-0.8.0 enum-variant additions (the XML/plist/HCL
  # families, 8c02951/29ba27d, and M2-F1 RecoveredDocument) are allowlisted
  # per crate via [package.metadata.cargo-semver-checks.lints]
  # enum_variant_added = "allow":
  #   - consema::ConversionProjectionReport/ConversionProjectionProvenance/
  #     FormatMismatch gained Xml/Plist/Hcl
  #   - consema-core::MatchRole gained XmlErrorRegion/HclErrorRegion
  #   - consema-document::NodeRole gained XmlErrorRegion/HclErrorRegion
  #   - consema-json::EditFailure/ProjectionFailure gained RecoveredDocument
  # The gate is green: every crate reports 222-223 checks with 0 failures
  # (the allowlist is read by the action, which runs the CLI in place at the
  # workspace root with --baseline-root; verified by reproducing the exact
  # action invocation). Note cargo-semver-checks 0.50.0 has no per-variant
  # allowlist, only lint-level, so future variant additions to these four
  # crates are also exempted and must be vetted in API review.
  semver:
    name: cargo-semver-checks (baseline v0.8.0 crates/ tree)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Materialize the v0.8.0 baseline outside the workspace root (see the
      # job comment): the tree of split-history commit fbe98b5c equals the
      # monorepo v0.8.0 crates/ tree and has no root manifest of its own.
      - name: prepare semver baseline (fbe98b5c tree + 11-member workspace + lockfile)
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/semver-baseline"
          mkdir -p "$baseline"
          git archive fbe98b5cae562087832f5509f25c32dc91fdd990 | tar -x -C "$baseline"
          cat > "$baseline/Cargo.toml" <<'EOF'
          [workspace]
          resolver = "3"
          members = [
              "consema",
              "consema-core",
              "consema-document",
              "consema-graph",
              "consema-ini",
              "consema-json",
              "consema-properties",
              "consema-protocol",
              "consema-pvce",
              "consema-toml",
              "consema-yaml",
          ]

          [workspace.dependencies]
          encoding_rs = { version = "=0.8.35", default-features = false, features = ["alloc"] }
          sha2 = { version = "=0.11.0", default-features = false }
          toml_edit = { version = "=0.22.27", default-features = false, features = ["parse"] }
          saphyr-parser = { version = "=0.0.11", default-features = false }
          unicode-id-start = "=1.4.0"

          [workspace.package]
          version = "0.8.0"
          edition = "2024"
          rust-version = "1.85"
          license = "MIT"

          [workspace.lints.rust]
          unsafe_code = "forbid"
          missing_docs = "warn"

          [workspace.lints.clippy]
          all = { level = "warn", priority = -1 }
          pedantic = { level = "warn", priority = -1 }
          module_name_repetitions = "allow"
          cast_possible_truncation = "allow"
          cast_possible_wrap = "allow"
          doc_markdown = "allow"
          missing_errors_doc = "allow"
          missing_panics_doc = "allow"
          needless_pass_by_value = "allow"
          too_many_lines = "allow"
          EOF
          cargo generate-lockfile --manifest-path "$baseline/Cargo.toml"
          echo "SEMVER_BASELINE_ROOT=$baseline" >> "$GITHUB_ENV"
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-root: ${{ env.SEMVER_BASELINE_ROOT }}
          release-type: patch
          package: >-
            consema,
            consema-core,
            consema-document,
            consema-graph,
            consema-ini,
            consema-json,
            consema-properties,
            consema-protocol,
            consema-pvce,
            consema-toml,
            consema-yaml

  # Package-archive verification (§15.6 "release artifact 可从干净环境重建",
  # scripts/verify-package-archives.ps1): on a clean checkout the script
  # packages every publishable crate, verifies tar-path safety and lockfile
  # checksums, checks each unpacked crate offline, and builds each crate
  # with the declared MSRV (1.85, from workspace rust-version) because the
  # MSRV leg is part of the 0.13.0 gate. cargo fetch warms the offline
  # cache that the script's --offline invocations rely on.
  package:
    name: verify-package-archives (with MSRV leg)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: cargo fetch --locked
        run: cargo fetch --locked
      - name: scripts/verify-package-archives.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/verify-package-archives.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Version-consistency gate (tokio check-readme pattern): the README
  # "Workspace version:" line must equal the Cargo.toml [workspace.package]
  # version, so a version bump that forgets the README fails CI.
  check-version-consistency:
    name: check README version vs Cargo.toml (version consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: assert Cargo.toml [workspace.package] version == README Workspace version line
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^\[workspace\.package\]/{f=1} f && /^version[[:space:]]*=/{gsub(/[",]/, "", $3); print $3; exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no 'version' found in Cargo.toml [workspace.package]"
            exit 1
          fi
          grep -qF "Workspace version: $version" README.md || {
            echo "::error::README.md does not declare 'Workspace version: $version'"
            exit 1
          }
          echo "README version consistent with Cargo.toml: $version"

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error, so the
  # allowed-failures list is empty.
  check:
    name: check (all gates green)
    if: always()
    needs: [lint, test, coverage, msrv, conformance, deny, audit, semver, package, check-version-consistency]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}
