# Consema Rust release: tag-triggered publishing of the 14 publishable
# crates to crates.io, in dependency order (top-tier bar: 半自动发布,
# pydantic precedent; crates.io trusted publishing GA 2025-07, RFC #3691).
#
# Credentials, primary path — crates.io trusted publishing (OIDC):
#   - The rust-lang/crates-io-auth-action exchanges the GitHub OIDC token
#     for a short-lived crates.io token (30 min, auto-revoked).
#   - User-side one-time setup per crate (see RELEASING.md §凭证配置):
#     crates.io → crate settings → Trusted Publishers, with
#     repository = consema/consema-rs and workflow file = release.yml
#     (the file name must match exactly; pull_request_target/workflow_run
#     triggers are not supported for trusted publishing).
#   - crates.io requires the first publication of a crate to be manual
#     (cargo login + cargo publish, or a one-off token), because the crate
#     must already exist before a trusted publisher can be attached.
#
# Fallback path: if the trusted publisher is not configured yet, the
# workflow falls back to the CARGO_REGISTRY_TOKEN repository secret
# (set it in Settings → Secrets and variables → Actions; see RELEASING.md).
# Either path ends in plain `cargo publish --locked -p <crate>`; the
# 14-crate order is the topological dependency order
# (core → document → graph → pvce → json → toml → yaml → ini → properties
# → xml → plist → hcl → protocol → consema). Publishing is idempotent and
# resumable (G042): a crate whose {crate}@{version} already exists on
# crates.io is skipped, so re-pushing a tag after a partial failure resumes
# the remaining crates instead of failing on "already exists"; a final
# crates.io verification step turns the job red until all 14 crates are
# actually published. Release gates (G106): the tag must point at the main
# branch HEAD, and the workspace test suite plus the artifact verification
# (cargo package of the 14 publishable crates — consema-conformance is
# publish = false and cannot verify from its packaged archive, so it is
# excluded from the gate) must pass before anything is uploaded.
name: Release to crates.io

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: cargo publish (14 crates, dependency order)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history: the HEAD guard below compares the tag commit
          # against the main branch history (merge-base), which needs the
          # objects, not just the shallow checkout of the tag (G071).
          fetch-depth: 0
      # Release guard (rc 前六角色审计 P1, 2026-08-12): the tag minus the
      # leading v must equal the workspace manifest version, otherwise a
      # mismatched tag could publish the wrong version to crates.io. G106:
      # the tag must also point at the main branch HEAD — a tag pushed from
      # a stale commit must not publish old code. G071: the comparison is
      # made against the main history at job runtime, not against the live
      # origin/main HEAD — a legitimate commit landing on main between the
      # tag push and this job must not turn a valid release red. The guard
      # therefore checks (a) the tag commit is an ancestor of (or equal to)
      # the current main HEAD, and (b) a recency window: the tag commit is
      # not more than 24 h older than the current main HEAD (a genuinely
      # stale tag still fails).
      - name: verify tag matches manifest version + main HEAD (Cargo.toml workspace)
        id: verify-tag
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$manifest" ]]; then
            echo "::error::could not read workspace version from Cargo.toml"
            exit 1
          fi
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml workspace version $manifest"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches workspace version $manifest"
          tag_commit="$(git rev-parse HEAD)"
          main_head="$(git rev-parse origin/main 2>/dev/null || git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$main_head" ]]; then
            echo "::error::cannot resolve the main branch HEAD (origin/main)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "$main_head"; then
            echo "::error::tag $GITHUB_REF_NAME does not point at the main branch history (tag=$tag_commit, main=$main_head)"
            exit 1
          fi
          tag_ts="$(git show -s --format=%ct "$tag_commit")"
          main_ts="$(git show -s --format=%ct "$main_head")"
          if (( main_ts - tag_ts > 86400 )); then
            echo "::error::tag $GITHUB_REF_NAME is stale: tag commit is more than 24h behind the main branch HEAD (tag=$tag_commit, main=$main_head)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME points at the main branch history (tag=$tag_commit, main=$main_head, window ok)"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # Release gates (G106): the same test suite and package-artifact
      # verification that CI enforces, run on the exact release commit
      # before anything is uploaded.
      - name: "gate: cargo test --workspace --locked"
        run: cargo test --workspace --locked
      # G072: the release gates must include the conformance freeze itself,
      # not just the crate test suites — the 18 suites / 519 cases /
      # aggregate-digest assertions live in ci.yml's conformance job, and a
      # release must not publish a tree whose vendored snapshot drifted.
      - name: "gate: conformance frozen counts + aggregate digest"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vectorDir = Join-Path $env:GITHUB_WORKSPACE 'conformance/vectors'
          $suites = 0
          $cases = 0
          foreach ($file in Get-ChildItem -LiteralPath $vectorDir -Filter '*.json') {
            $vector = Get-Content -LiteralPath $file.FullName -Raw -Encoding utf8 | ConvertFrom-Json
            if (-not ($vector.suite -like 'consema.*')) {
              throw "unexpected suite id in $($file.Name): $($vector.suite)"
            }
            $suites += 1
            $cases += @($vector.cases).Count
          }
          if ($suites -ne 18 -or $cases -ne 519) {
            throw "suite-count mismatch: expected 18 suites / 519 cases, got $suites suites / $cases cases"
          }
          $names = @(Get-ChildItem -LiteralPath $vectorDir -Filter '*.json' | ForEach-Object { $_.Name })
          [System.Array]::Sort($names, [System.StringComparer]::Ordinal)
          $lines = @()
          foreach ($name in $names) {
            $digest = (Get-FileHash -LiteralPath (Join-Path $vectorDir $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$name`:$digest"
          }
          $aggregateText = [string]::Join("`n", $lines)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $aggregateBytes = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($aggregateText))
          } finally {
            $sha.Dispose()
          }
          $computed = ([System.BitConverter]::ToString($aggregateBytes)).Replace('-', '').ToLowerInvariant()
          $expected = 'cfd6e296da5b22b62d37b076d35bf6bbf58b0678ceddb37eea51a8b47200ab6a'
          if ($computed -ne $expected) {
            throw "aggregate digest mismatch: computed $computed, expected $expected (vendored snapshot drifted from the frozen inventory)"
          }
          Write-Output "conformance freeze: $suites suites / $cases cases, digest $computed"
      - name: "gate: cargo package (every publishable crate, artifact verification)"
        # Wave-2 G23: consema-conformance is publish = false and embeds the
        # conformance vectors/oracles/fixtures via include_str! from outside
        # its crate directory, so its packaged archive can never verify
        # standalone (cargo package --workspace dies deterministically on it
        # with 70 "couldn't read" errors). The gate therefore covers exactly
        # the 14 publishable crates; each publish step below re-verifies its
        # archive inside `cargo publish --locked -p <crate>` right before
        # upload (dependency order means intra-workspace deps already exist
        # on crates.io by then).
        run: cargo package --workspace --locked --exclude consema-conformance
      - name: exchange OIDC token for a short-lived crates.io token (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        # Not configured yet (or first manual publication): fall back to the
        # CARGO_REGISTRY_TOKEN secret. The publish steps fail clearly if
        # neither path has credentials.
        continue-on-error: true
      # Idempotent/resumable publish (G042): dependency order over the fixed
      # 14-crate list; a crate whose {crate}@{version} already exists on
      # crates.io is skipped, so re-pushing the tag after a partial failure
      # resumes where the previous run stopped. The step script runs under
      # `set -euo pipefail`, so a publish failure aborts the loop at the
      # failing crate — the resumability is across RUNS (re-push the tag and
      # the curl skip-check resumes the remaining crates), not within the
      # step; continue-on-error only keeps the rest of the job observable.
      # The final verification step below turns the job red until every
      # crate is actually published.
      - name: cargo publish (dependency order; already-published crates skipped)
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.verify-tag.outputs.version }}"
          crates=(consema-core consema-document consema-graph consema-pvce consema-json consema-toml consema-yaml consema-ini consema-properties consema-xml consema-plist consema-hcl consema-protocol consema)
          for crate in "${crates[@]}"; do
            if curl -fsS "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "resume: $crate $version already published, skipping"
              continue
            fi
            echo "publishing: $crate $version"
            cargo publish --locked -p "$crate"
          done
      - name: verify all 14 crates are published (crates.io API)
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.verify-tag.outputs.version }}"
          crates=(consema-core consema-document consema-graph consema-pvce consema-json consema-toml consema-yaml consema-ini consema-properties consema-xml consema-plist consema-hcl consema-protocol consema)
          missing=0
          for crate in "${crates[@]}"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$crate/$version")"
              if [[ "$code" == "200" ]]; then
                echo "published: $crate $version"
                ok=1
                break
              fi
              if [[ "$code" == "404" ]]; then
                echo "::error::not published: $crate $version"
                missing=1
                ok=1
                break
              fi
              # G022: unauthenticated crates.io requests are IP rate-limited
              # and can hit transient 5xx; only a real 404 means "not
              # published". Retry with backoff before deciding.
              echo "retry $attempt/5: crates.io returned $code for $crate $version (backing off $((attempt * 10))s)"
              sleep "$((attempt * 10))"
            done
            if [[ "$ok" -eq 0 ]]; then
              echo "::error::crates.io kept returning a non-404 error for $crate $version (rate limit or transient failure); re-run the verification"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::one or more crates are not published; re-push the tag to resume (already-published crates are skipped)"
            exit 1
          fi
          echo "all 14 crates published: $version"
