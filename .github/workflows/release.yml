# Consema Rust release: tag-triggered publishing of the publishable crates
# to crates.io, in dependency order (top-tier bar: 半自动发布,
# pydantic precedent; crates.io trusted publishing GA 2025-07, RFC #3691).
# The publishable set is derived from cargo metadata at runtime (publish ==
# null members; currently 14 crates) — wave-4 R10: no hand-maintained
# crate list, so a future 15th publishable crate is published automatically.
#
# Credentials, primary path — crates.io trusted publishing (OIDC):
#   - The rust-lang/crates-io-auth-action exchanges the GitHub OIDC token
#     for a short-lived crates.io token (30 min, auto-revoked).
#   - Timing (wave-4 R31, documented honestly): the publish job has
#     timeout-minutes 60, and the OIDC token lives 30 minutes. The publish
#     loop runs zero-cache cold builds of up to 14 crates, each doing one
#     verification build inside `cargo publish`, so the loop can in
#     principle exceed the token lifetime; a token that expires mid-loop
#     fails the later crates with an auth error (set -euo pipefail aborts
#     the loop) and the release is resumed by re-pushing the tag (G042:
#     already-published crates are skipped; the release guard exempts a
#     resume re-push from the 24 h recency window). No caching or
#     token-splitting is added before 1.0.0 (post-1.0.0 backlog): the
#     resume flow is the documented recovery path.
#   - User-side one-time setup per crate (see RELEASING.md §凭证配置):
#     crates.io → crate settings → Trusted Publishers, with
#     repository = consema/consema-rs and workflow file = release.yml
#     (the file name must match exactly; pull_request_target/workflow_run
#     triggers are not supported for trusted publishing).
#   - crates.io requires the first publication of a crate to be manual
#     (cargo login + cargo publish, or a one-off token), because the crate
#     must already exist before a trusted publisher can be attached.
#
# Fallback path: if the trusted publisher is not configured yet, the
# workflow falls back to the CARGO_REGISTRY_TOKEN repository secret
# (set it in Settings → Secrets and variables → Actions; see RELEASING.md).
# Either path ends in plain `cargo publish --locked -p <crate>`; the
# publish order is the dependency-topological order computed at runtime
# from the cargo metadata dependency graph (scripts/publish-order.jq,
# Kahn's algorithm with an alphabetical tie-break; the current 14-crate
# result is core → document → graph → hcl → ini → json → plist →
# properties → pvce → protocol → toml → xml → yaml → consema), so every
# crate publishes after its intra-workspace dependencies and a future
# 15th publishable crate is inserted automatically. Publishing is
# idempotent and
# resumable (G042): a crate whose {crate}@{version} already exists on
# crates.io is skipped, so re-pushing a tag after a partial failure resumes
# the remaining crates instead of failing on "already exists"; a final
# crates.io verification step turns the job red until every publishable
# crate is actually published. Release gates (G106): the tag commit must lie on the
# main branch history — G071 implements this as a merge-base ancestor check
# against the job-time main HEAD plus a 24 h recency window that constrains
# the first push of the tag only: a resume re-push (any crate of the release
# already on crates.io at the tag version) is exempt and held to the ancestor
# check alone (see the verify-tag step; "point at the main branch HEAD" would
# be the stricter equality semantics that the ancestor check deliberately
# replaced) — and
# the workspace test suite plus the artifact verification (cargo package of
# the 14 publishable crates — consema-conformance is publish = false and
# cannot verify from its packaged archive, so it is excluded from the gate)
# must pass before anything is uploaded.
name: Release to crates.io

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: cargo publish (publishable crates, dependency order)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history: the HEAD guard below compares the tag commit
          # against the main branch history (merge-base), which needs the
          # objects, not just the shallow checkout of the tag (G071).
          fetch-depth: 0
      # Release guard (rc 前六角色审计 P1, 2026-08-12): the tag minus the
      # leading v must equal the workspace manifest version, otherwise a
      # mismatched tag could publish the wrong version to crates.io. G106:
      # the tag must also point at the main branch HEAD — a tag pushed from
      # a stale commit must not publish old code. G071: the comparison is
      # made against the main history at job runtime, not against the live
      # origin/main HEAD — a legitimate commit landing on main between the
      # tag push and this job must not turn a valid release red. The guard
      # therefore checks (a) the tag commit is an ancestor of (or equal to)
      # the current main HEAD, and (b) a recency window: on a first push the
      # tag commit must not be more than 24 h older than the current main
      # HEAD (a genuinely stale tag still fails). The window does not apply
      # to a resume re-push (wave-4 P1, 2026-08-15): when the window would
      # trip, the guard probes crates.io for the release version on the
      # first crate in publish order (consema-core — strict dependency order
      # means it is always the first crate published, so its existence at
      # the version is exactly "this release was started before"); a hit
      # means the run is re-pushing the tag to finish a partially published
      # release (G042) and only the ancestor check applies, a miss means a
      # genuinely stale tag and the window still fails the run. The probe
      # uses the same "already exists" predicate as the publish loop, one
      # request, with backoff retries (G022) and fail-closed on an undecided
      # probe — never guessed, so a stale first push can never publish old
      # code on a flaky answer.
      - name: verify tag matches manifest version + main HEAD (Cargo.toml workspace)
        id: verify-tag
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ -z "$manifest" ]]; then
            echo "::error::could not read workspace version from Cargo.toml"
            exit 1
          fi
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml workspace version $manifest"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches workspace version $manifest"
          tag_commit="$(git rev-parse HEAD)"
          main_head="$(git rev-parse origin/main 2>/dev/null || git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$main_head" ]]; then
            echo "::error::cannot resolve the main branch HEAD (origin/main)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "$main_head"; then
            echo "::error::tag $GITHUB_REF_NAME does not point at the main branch history (tag=$tag_commit, main=$main_head)"
            exit 1
          fi
          tag_ts="$(git show -s --format=%ct "$tag_commit")"
          main_ts="$(git show -s --format=%ct "$main_head")"
          if (( main_ts - tag_ts > 86400 )); then
            # Outside the 24 h recency window: either a genuinely stale
            # first push (reject) or a resume re-push finishing a partially
            # published release (G042 — allow). The resume predicate is the
            # same "already exists" check the publish loop uses, probed on
            # consema-core, the first crate in publish order: strict
            # dependency order means it is always the first crate published,
            # so consema-core@$manifest existing on crates.io is exactly
            # "this release was started before". One request keeps the guard
            # out of the shared-runner crates.io rate limit (G022); backoff
            # retries like the verification step; fail closed on an undecided
            # probe (never guess — a stale first push must not publish old
            # code on a flaky answer).
            resume=0
            decided=0
            for attempt in 1 2 3 4 5; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/consema-core/$manifest" 2>/dev/null || true)"
              if [[ "$code" == "200" ]]; then
                resume=1
                decided=1
                break
              fi
              if [[ "$code" == "404" ]]; then
                resume=0
                decided=1
                break
              fi
              echo "retry $attempt/5: crates.io returned $code for consema-core@$manifest (backing off $((attempt * 10))s)"
              sleep "$((attempt * 10))"
            done
            if [[ "$decided" -ne 1 ]]; then
              echo "::error::cannot determine whether this run is a resume re-push (crates.io kept returning $code for consema-core@$manifest); re-run the job"
              exit 1
            fi
            if [[ "$resume" -eq 1 ]]; then
              echo "resume re-push: consema-core@$manifest already on crates.io, 24 h recency window skipped (ancestor check above applies; tag=$tag_commit, main=$main_head)"
            else
              echo "::error::tag $GITHUB_REF_NAME is stale: tag commit is more than 24h behind the main branch HEAD (tag=$tag_commit, main=$main_head)"
              exit 1
            fi
          else
            echo "tag $GITHUB_REF_NAME points at the main branch history (tag=$tag_commit, main=$main_head, window ok)"
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
      # W3-30 (wave-3 adversarial audit, 2026-08-14): the release toolchain
      # is pinned to 1.97.1 — the same version the four-language differential
      # emitters pin (consema-go/ts/py/kt release & ci differential jobs,
      # rustc 1.97.1 8bab26f4f 2026-07-14; see consema docs
      # five-element-review-1.0.0.md "rustc 统一钉 1.97.1"), so a release
      # build and the differential goldens are produced by the same compiler
      # and can never disagree over toolchain behavior; independent of the
      # runner's current stable (go release.yml 体例). The workspace MSRV
      # stays 1.85 (ci.yml msrv job verifies it).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1
      # Release gates (G106): the same test suite and package-artifact
      # verification that CI enforces, run on the exact release commit
      # before anything is uploaded.
      - name: "gate: cargo test --workspace --locked"
        run: cargo test --workspace --locked
      # G072: the release gates must include the conformance freeze itself,
      # not just the crate test suites — the 18 suites / 519 cases /
      # aggregate-digest assertions live in ci.yml's conformance job, and a
      # release must not publish a tree whose vendored snapshot drifted.
      - name: "gate: conformance frozen counts + aggregate digest"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vectorDir = Join-Path $env:GITHUB_WORKSPACE 'conformance/vectors'
          $suites = 0
          $cases = 0
          foreach ($file in Get-ChildItem -LiteralPath $vectorDir -Filter '*.json') {
            $vector = Get-Content -LiteralPath $file.FullName -Raw -Encoding utf8 | ConvertFrom-Json
            if (-not ($vector.suite -like 'consema.*')) {
              throw "unexpected suite id in $($file.Name): $($vector.suite)"
            }
            $suites += 1
            $cases += @($vector.cases).Count
          }
          if ($suites -ne 18 -or $cases -ne 519) {
            throw "suite-count mismatch: expected 18 suites / 519 cases, got $suites suites / $cases cases"
          }
          $names = @(Get-ChildItem -LiteralPath $vectorDir -Filter '*.json' | ForEach-Object { $_.Name })
          [System.Array]::Sort($names, [System.StringComparer]::Ordinal)
          $lines = @()
          foreach ($name in $names) {
            $digest = (Get-FileHash -LiteralPath (Join-Path $vectorDir $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$name`:$digest"
          }
          $aggregateText = [string]::Join("`n", $lines)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $aggregateBytes = $sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($aggregateText))
          } finally {
            $sha.Dispose()
          }
          $computed = ([System.BitConverter]::ToString($aggregateBytes)).Replace('-', '').ToLowerInvariant()
          # Wave-4 R10: the expected digest is read from the vendored
          # conformance/DIGEST file — the single sync point (re-vendor =
          # recompute and commit that file), no hand-maintained literal.
          $expected = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'conformance/DIGEST') -Raw).Trim()
          if ($computed -ne $expected) {
            throw "aggregate digest mismatch: computed $computed, expected $expected (vendored snapshot drifted from the frozen inventory)"
          }
          Write-Output "conformance freeze: $suites suites / $cases cases, digest $computed"
      - name: "gate: cargo package (every publishable crate, artifact verification)"
        # Wave-2 G23: consema-conformance is publish = false and embeds the
        # conformance vectors/oracles/fixtures via include_str! from outside
        # its crate directory, so its packaged archive can never verify
        # standalone (cargo package --workspace dies deterministically on it
        # with 70 "couldn't read" errors). The gate therefore covers exactly
        # the publishable crates (cargo-metadata-derived set, wave-4 R10);
        # each publish step below re-verifies its archive inside
        # `cargo publish --locked -p <crate>` right before upload
        # (dependency order means intra-workspace deps already exist on
        # crates.io by then).
        run: cargo package --workspace --locked --exclude consema-conformance
      - name: exchange OIDC token for a short-lived crates.io token (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        # Not configured yet (or first manual publication): fall back to the
        # CARGO_REGISTRY_TOKEN secret. The publish steps fail clearly if
        # neither path has credentials.
        continue-on-error: true
      # Idempotent/resumable publish (G042): dependency order over the
      # cargo-metadata-derived publishable set (wave-4 R10); a crate whose
      # {crate}@{version} already exists on
      # crates.io is skipped, so re-pushing the tag after a partial failure
      # resumes where the previous run stopped. The release guard matches
      # this semantics (wave-4 P1): the verify-tag step exempts a resume
      # re-push — detected by the same "already exists" predicate on the
      # first publish-order crate — from the 24 h recency window, so a
      # re-push more than 24 h after the tag commit still reaches this
      # step. The step script runs under `set -euo pipefail`, so a publish
      # failure aborts the loop at the failing crate — the resumability is
      # across RUNS (re-push the tag and the skip-check resumes the
      # remaining crates), not within the step; continue-on-error only
      # keeps the rest of the job observable. Transient crates.io failures
      # inside the loop are tolerated with backoff retries (G022, wave-4
      # R10): the skip-check only decides on a real 404 and cargo publish
      # itself retries with backoff (a partial upload is caught by the
      # "already exists" predicate). The final verification step below
      # turns the job red until every publishable crate is actually
      # published.
      - name: cargo publish (dependency order; already-published crates skipped)
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.verify-tag.outputs.version }}"
          # Wave-4 R10 + wave-5 P0: the publishable crate set is derived
          # from cargo metadata (publish == null members — the same
          # predicate release-sign.ps1 and verify-package-archives.ps1 use,
          # where order is irrelevant because they never publish), not a
          # hand-maintained list: a future 15th publishable crate must be
          # published automatically instead of passing every gate and
          # silently missing the loop. The ORDER comes from
          # scripts/publish-order.jq: a dependency-topological order over
          # the intra-workspace edges (alphabetical tie-break among ready
          # crates), so every crate publishes after its workspace
          # dependencies — an alphabetical sort would put the consema
          # facade (it depends on all 13 sibling crates) first and fail
          # its very first publish. jq aborts (zero output, non-zero exit)
          # on a dependency cycle or an edge to a crate outside the
          # publishable set, and the command substitutions below propagate
          # that failure to this step (set -e) — the loop must never guess
          # an order.
          metadata="$(cargo metadata --no-deps --format-version 1 --locked)"
          order="$(jq -r -f scripts/publish-order.jq <<<"$metadata")"
          mapfile -t crates <<<"$order"
          if [[ "${#crates[@]}" -eq 1 && -z "${crates[0]}" ]]; then
            crates=()
          fi
          echo "publishable crates (from cargo metadata, ${#crates[@]}): ${crates[*]}"
          if [[ "${#crates[@]}" -lt 1 ]]; then
            echo "::error::cargo metadata reports no publishable crates"
            exit 1
          fi
          for crate in "${crates[@]}"; do
            # Resumable skip-check with backoff retries (G022, wave-4 R10):
            # unauthenticated crates.io requests are IP rate-limited and can
            # hit transient 5xx; only a real 404 decides "not published" —
            # a flaky 429/5xx must not skip an unpublished crate (it would
            # then fail the publish and abort the loop with "already
            # exists").
            published=0
            decided=0
            for attempt in 1 2 3 4 5; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$crate/$version" 2>/dev/null || true)"
              if [[ "$code" == "200" ]]; then
                published=1
                decided=1
                break
              fi
              if [[ "$code" == "404" ]]; then
                decided=1
                break
              fi
              echo "retry $attempt/5: crates.io returned $code for $crate $version (backing off $((attempt * 10))s)"
              sleep "$((attempt * 10))"
            done
            if [[ "$decided" -ne 1 ]]; then
              echo "::error::crates.io kept returning a non-404 error for $crate $version (rate limit or transient failure); cannot decide whether it is published — re-run the job"
              exit 1
            fi
            if [[ "$published" -eq 1 ]]; then
              echo "resume: $crate $version already published, skipping"
              continue
            fi
            echo "publishing: $crate $version"
            # Bounded backoff retries around cargo publish itself (wave-4
            # R10, G022 parity with the verify step): the upload can hit the
            # same transient 5xx/429 as the API; a retry after a failed
            # upload is harmless ("already exists" is treated as success —
            # the final verification step below turns the job red until
            # every crate is actually on crates.io). The error log is kept
            # per attempt so the failure message names the real cause.
            published_ok=0
            for attempt in 1 2 3; do
              publish_err="$(mktemp)"
              if cargo publish --locked -p "$crate" 2>"$publish_err"; then
                published_ok=1
                rm -f "$publish_err"
                break
              fi
              if grep -q "already exists\|already uploaded" "$publish_err"; then
                echo "resume: $crate $version already published (cargo publish reported it), skipping"
                published_ok=1
                rm -f "$publish_err"
                break
              fi
              echo "retry publish $attempt/3: cargo publish failed for $crate (backing off $((attempt * 15))s)"
              cat "$publish_err" >&2
              rm -f "$publish_err"
              sleep "$((attempt * 15))"
            done
            if [[ "$published_ok" -ne 1 ]]; then
              echo "::error::cargo publish failed for $crate $version; re-push the tag to resume (already-published crates are skipped)"
              exit 1
            fi
          done
      - name: verify every publishable crate is published (crates.io API)
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.verify-tag.outputs.version }}"
          # Same cargo-metadata derivation as the publish step (wave-4 R10
          # + wave-5 P0): the verification must cover the same set — and the
          # same dependency-topological order — the loop publishes.
          metadata="$(cargo metadata --no-deps --format-version 1 --locked)"
          order="$(jq -r -f scripts/publish-order.jq <<<"$metadata")"
          mapfile -t crates <<<"$order"
          if [[ "${#crates[@]}" -eq 1 && -z "${crates[0]}" ]]; then
            crates=()
          fi
          echo "verifying ${#crates[@]} publishable crates: ${crates[*]}"
          missing=0
          for crate in "${crates[@]}"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$crate/$version")"
              if [[ "$code" == "200" ]]; then
                echo "published: $crate $version"
                ok=1
                break
              fi
              if [[ "$code" == "404" ]]; then
                echo "::error::not published: $crate $version"
                missing=1
                ok=1
                break
              fi
              # G022: unauthenticated crates.io requests are IP rate-limited
              # and can hit transient 5xx; only a real 404 means "not
              # published". Retry with backoff before deciding.
              echo "retry $attempt/5: crates.io returned $code for $crate $version (backing off $((attempt * 10))s)"
              sleep "$((attempt * 10))"
            done
            if [[ "$ok" -eq 0 ]]; then
              echo "::error::crates.io kept returning a non-404 error for $crate $version (rate limit or transient failure); re-run the verification"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::one or more crates are not published; re-push the tag to resume (already-published crates are skipped; the release guard skips the 24 h recency window for a resume re-push)"
            exit 1
          fi
          echo "all ${#crates[@]} publishable crates published: $version"
