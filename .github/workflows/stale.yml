name: stale

# Zod 模式：只处理带 needs-info 标签的 issue/PR——7 天未补充信息则标记，
# 再 5 天仍未回复则自动关闭；PR 不标记（stale-pr-message 为空）。
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          only-labels: needs-info
          days-before-stale: 7
          days-before-close: 5
          stale-issue-message: |-
            该 issue 已 7 天未收到所需补充信息。请回复必要信息（复现步骤、版本、期望行为或相关日志），否则本 issue 将在 5 天后自动关闭。
          close-issue-message: |-
            该 issue 因缺少必要信息且 5 天内未获回复，已自动关闭。如果问题仍然存在，请补充完整信息后重新打开，或新建 issue 并附上所需细节。
          stale-pr-message: ''
          operations-per-run: 100
