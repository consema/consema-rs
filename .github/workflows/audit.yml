# Dependency audit, dual-track (schedule/push + PR). The standing security
# gate in ci.yml (deny + audit jobs) runs on every push/PR; this workflow
# adds the tracks that ci.yml cannot express:
#
#   - audit: daily cron (03:37 UTC, non-standard minute to spread load) plus
#     every push to main (unconditional — no path filter). Same no-fetch
#     RustSec check as the ci.yml audit job (rustsec/audit-check pins the
#     advisory database through the action instead of letting cargo-audit
#     fetch it).
#   - pr-audit: every pull request runs the same cargo-deny advisories
#     command as the ci.yml deny job (the PR path uses advisories only; the
#     full bans/licenses/sources gate stays in ci.yml).
#
# The push/PR tracks used to be path-filtered to Cargo.toml/Cargo.lock
# changes; the filters are gone so this workflow is a constantly-running
# check that branch protection can require. The cost is acceptable: the
# dependency surface is small (Cargo.lock: 83 packages, as reported by
# cargo-audit 0.22.2 "Scanning Cargo.lock ... (83 crate dependencies)").
# The workspace's directly-declared external dependencies are the 7
# exactly-pinned crates in [workspace.dependencies] plus the CLI facade's
# ctrlc (consema/Cargo.toml); consema-conformance's dev-dependency proptest
# is a test-only edge not counted in that figure, and cargo-audit itself
# reports lockfile-wide counts, not a per-crate "direct" breakdown. A
# cargo-audit run is ~1 minute.
#
# Both jobs keep the exact gates of ci.yml so the scheduled, push and PR
# paths share one bar. No repository secrets are required (automatic
# GITHUB_TOKEN only; the audit job needs checks: write because
# rustsec/audit-check posts a check run, identical to the ci.yml audit job).
#
# Local (dev-machine) toolchain versions for vulnerability scanning, as of
# 2026-08-12: cargo-audit 0.22.2, cargo-deny 0.20.2 (cargo install). The
# workflow itself deliberately does not pin cargo-audit/cargo-deny: the
# rustsec/audit-check action pins the RustSec advisory database, and the
# cargo-deny-action ships its own pinned binaries, so CI never fetches the
# advisory database at runtime. Local runs use the same gates
# (`cargo audit` / `cargo deny check advisories bans licenses sources`)
# against the same committed Cargo.lock.
name: Dependency audit

on:
  schedule:
    - cron: '37 3 * * *'
  push:
    branches: [main]
  pull_request:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'pull_request'
    name: cargo audit (RustSec advisory DB, daily + every push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  pr-audit:
    if: github.event_name == 'pull_request'
    name: cargo deny check advisories (every PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: embarkstudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories
