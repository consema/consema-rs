# Path-based area labels for .github/workflows/labeler.yml (actions/labeler
# v7 config: label -> list of match objects; top-level match objects are
# OR-ed (a bare `changed-files` entry defaults to `any`), and inside a
# combinator `any-glob-to-any-file` means "any changed file matching any
# glob" — a single source-file hit is enough to apply the label, so a mixed
# source + docs PR gets both `area: core` and `area: docs` (the rules are
# independent; the former `all-globs-to-all-files` + `!**/*.md` structure
# made every changed file have to match and dropped core on any md in the
# PR). Literal root patterns (LICENSE/.gitignore/.gitattributes) match only
# the repo-root file (minimatch, no matchBase). Area labels are derived from
# paths only; `kind:` labels remain the human/PR-template merge gate
# (pr-labels.yml).

'area: core':
  # any changed file inside a crate (source hit is enough)
  - changed-files:
      - any-glob-to-any-file:
          - 'consema*/**'
  # any changed file inside the vendored conformance snapshot
  - changed-files:
      - any-glob-to-any-file:
          - 'conformance/**'
  # workspace manifest / lockfile
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.toml'
          - 'Cargo.lock'
  # repo-root meta files (literal names, root-only — no subtree matches)
  - changed-files:
      - any-glob-to-any-file:
          - 'LICENSE'
          - '.gitignore'
          - '.gitattributes'

'area: ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
  # root-level tooling / policy files (fuzz-evidence driver, dependency gate)
  - changed-files:
      - any-glob-to-any-file:
          - 'run_waves.ps1'
          - 'deny.toml'

'area: docs':
  # Wave-5 P2 fix: '**/*.md' covers every markdown file, and the separate
  # 'docs/**' branch covers non-markdown files under docs/ (e.g. future
  # JSON/scripts/images) so the labeler's coverage matches the documented
  # semantics in .github/LABELS.md ("Documentation: `*.md`, `docs/**`") —
  # the old comment claimed the two globs "overlap completely", which is
  # not true for non-md files under docs/ (the rs docs/ dir currently
  # holds only COVERAGE-0.13.0.md, so the gap was latent).
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
