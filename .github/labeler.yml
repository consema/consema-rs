# Path-based area labels for .github/workflows/labeler.yml (actions/labeler
# v7 config: label -> list of match objects; combinators are AND-ed inside
# `all`, OR-ed inside `any`, plain lists default to `any`; `!` negation is
# supported inside a combinator's glob list). Area labels are derived from
# paths only; `kind:` labels remain the human/PR-template merge gate
# (pr-labels.yml).

'area: core':
  - changed-files:
      - any-glob-to-any-file:
          - 'consema*/**'
          - 'conformance/**'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - '!**/*.md'

'area: ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'

'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
