---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-api
  labels:
    app.kubernetes.io/name: edge-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-api
    spec:
      containers:
        - name: api
          image: example.invalid/edge-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: edge-api
spec:
  selector:
    app.kubernetes.io/name: edge-api
  ports:
    - name: http
      port: 80
      targetPort: http
