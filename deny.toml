# Consema's executable dependency policy. Keep exceptions explicit and justified.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false

[bans]
# multiple-versions = "deny" is the policy. The three duplicate version
# groups currently in Cargo.lock are documented here as justified (G044):
# the bans graph that cargo-deny analyzes excludes dev-dependencies and
# lockfile-only packages, so these duplicates are not intercepted by the
# gate — this note is the explicit justification record:
#   - getrandom 0.3.4 / 0.4.3: both sit under the proptest dev-dependency
#     subtree of consema-conformance (rand_core 0.9.5 -> getrandom 0.3.4;
#     tempfile -> getrandom 0.4.3). Dev-only, never shipped to consumers;
#     unifying would pin transitive versions of rand/tempfile outside this
#     repository's control.
#   - syn 2.0.119 / 3.0.3: syn 2.0.119 is a lockfile-only entry reachable
#     by no workspace target (verified `cargo tree -i` with --all-features;
#     the graph uses syn 3.0.3 via thiserror 2 -> saphyr-parser); a future
#     `cargo update` prunes it.
#   - r-efi 5.3.0 / 6.0.0: both lockfile-only, reachable by no workspace
#     target; same pruning note.
# Any duplicate that DOES appear in the analyzed graph still fails the gate.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
